# Local development against an in-memory database, so the app runs without
# Docker or a Postgres install. Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# The schema is still generated by Hibernate from the same entities, so it
# matches what Postgres gets. Data is discarded when the process exits.

spring.datasource.url=jdbc:h2:mem:stock_game;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Browse the data at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:stock_game, user: sa, no password)
spring.h2.console.enabled=true

# Seed two demo players and a game already in progress.
app.dev.seed=true

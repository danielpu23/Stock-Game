spring.application.name=stock-game
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_game
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

stock.api.key=<your-finnhub-api-key> //replace with your actual Finnhub API key
stock.api.url=https://finnhub.io/api/v1
jwt.secret=<your-secret-key> //use a strong secret key for JWT signing
jwt.expiration=86400000
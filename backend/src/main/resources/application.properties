spring.application.name=stock-game
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_game
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Finnhub. Leave STOCK_API_KEY unset to run against the built-in simulated
# market instead; set it to a real key to use live quotes.
stock.api.key=${STOCK_API_KEY:}
stock.api.url=https://finnhub.io/api/v1

# How long a quote stays cached. Finnhub's free tier allows 60 calls/min and the
# game re-prices every holding on a 5s poll, so this keeps us well under.
stock.price.cache-ttl-seconds=15

# Dev-only default. Override with JWT_SECRET in any real deployment.
# HS256 needs at least 32 bytes of key material.
jwt.secret=${JWT_SECRET:99e7bca12647b8479b473e637629fc392df6bbfe2ea36659435648a4c07409f9}
jwt.expiration=86400000

# Allowed browser origin for the Vite dev server.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

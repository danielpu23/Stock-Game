spring.application.name=stock-game

# Database configuration - will be provided by cloud platform
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Stock API configuration
stock.api.key=${STOCK_API_KEY}
stock.api.url=https://finnhub.io/api/v1

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server configuration
server.port=${PORT:8080}

# CORS configuration - set to your domain or localhost for EC2
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost}
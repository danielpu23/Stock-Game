# Tests run against in-memory H2 so the suite needs no Docker and no running
# Postgres. Without this, contextLoads fails on any machine that doesn't happen
# to have the database up.

spring.datasource.url=jdbc:h2:mem:stock_game_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deterministic values so tests never depend on the environment or the network.
# This file replaces the main application.properties on the test classpath
# rather than merging with it, so every key the app reads must appear here.
stock.api.key=
stock.api.url=https://finnhub.io/api/v1
stock.price.cache-ttl-seconds=15
jwt.secret=test-secret-key-that-is-long-enough-for-hs256
jwt.expiration=86400000
cors.allowed-origins=http://localhost:5173

# Never seed demo data into a test context.
app.dev.seed=false
